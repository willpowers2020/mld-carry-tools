name: Update carry data

on:
  schedule:
    # Run daily at 8 AM UTC (midnight PST — all states' evening draws are in)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install mongodb

      - name: Generate carry data
        working-directory: scripts
        env:
          MONGO_URL: ${{ secrets.MONGODB_URI }}
        run: node generate-carry-data.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add carry-data.json recent-draws.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update carry data $(date -u +%Y-%m-%d)"
          git push
